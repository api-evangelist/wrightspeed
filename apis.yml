aid: wrightspeed
name: Wrightspeed
description: >-
  Wrightspeed is an electric-powertrain manufacturer in Alameda, California, founded in
  2005 by Tesla co-founder Ian Wright and rebranded as REVO Powertrains in May 2022. Its
  product is the RePower Platform, a "Powertrain-in-a-Crate" retrofit kit that converts
  existing diesel Class 6 and 7 trucks and buses into battery-electric vehicles by
  replacing the legacy motor, transmission, rear axle, cooling, HVAC and fuel systems with
  an integrated e-axle, high-voltage battery, electrical harness, instrument cluster and a
  Vehicle Dynamics Module carrying traction control, diagnostics, telematics and
  over-the-air updates. Wrightspeed is a hardware company: the software it ships is
  embedded in the vehicle and sold with the kit. It publishes an eight-page Webflow
  marketing site (platform, about, careers, contact, reserve, terms, privacy) and no
  developer portal, API, SDK, webhook surface or machine-readable specification of any
  kind.
